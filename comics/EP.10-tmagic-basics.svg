<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad10" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg10)"/>
  <polygon points="1000,0 1080,0 780,840 700,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="140,0 210,0 1030,840 960,840" fill="#f97316" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.10</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad10)">左右互搏：编辑器和画布是两个独立进程</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">低代码产品实战 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad10)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">两个独立进程，Bundle 分别打包</text>
    <g data-role="label" transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="330" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">Bundle 警告：7.84MB 拆成两份</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">两个独立入口，两个独立 HTML。</text>
    <rect x="24" y="150" width="258" height="96" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.4"/>
    <rect x="24" y="150" width="258" height="22" rx="8" fill="#1e2a44"/>
    <text x="38" y="167" font-size="12.5" font-weight="bold" fill="#22d3ee">index.html 编辑器进程</text>
    <text x="38" y="190" font-size="12" fill="#e2e8f0" font-family="'SF Mono',Consolas,monospace">tmagic-editor</text>
    <text x="38" y="208" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">拖拽面板 + 属性面板</text>
    <text x="38" y="226" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">持有 DSL 的父窗口</text>
    <rect x="290" y="150" width="258" height="96" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <rect x="290" y="150" width="258" height="22" rx="8" fill="#1e2a44"/>
    <text x="304" y="167" font-size="12.5" font-weight="bold" fill="#f97316">runtime.html 画布进程</text>
    <text x="304" y="190" font-size="12" fill="#e2e8f0" font-family="'SF Mono',Consolas,monospace">tmagic-runtime</text>
    <text x="304" y="208" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">iframe 里独立运行</text>
    <text x="304" y="226" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">渲染真实组件树</text>
    <rect x="24" y="260" width="524" height="40" rx="8" fill="#111a30" stroke="#fbbf24" stroke-opacity="0.5"/>
    <rect x="24" y="260" width="4" height="40" rx="2" fill="#fbbf24"/>
    <text x="40" y="277" font-size="13.5" fill="#fbbf24">两个 Bundle 各自独立，不能互相 import；</text>
    <text x="40" y="293" font-size="13.5" fill="#94a3b8">通信必须走 postMessage 或 magic API。</text>
    <rect x="24" y="310" width="524" height="40" rx="8" fill="#0a0f1c" stroke="#223055"/>
    <text x="38" y="329" font-size="13.5" fill="#e2e8f0">编辑器只管 DSL，画布只负责按 DSL 画组件。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">通信：magic API vs useEditorDsl</text>
    <g data-role="pixel" transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="340" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">父窗口调 magic API 写 DSL，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">iframe 里 useEditorDsl() 挂回调。</text>
    <rect x="24" y="150" width="252" height="110" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.4"/>
    <rect x="24" y="150" width="252" height="22" rx="8" fill="#1e2a44"/>
    <text x="38" y="167" font-size="12.5" font-weight="bold" fill="#a78bfa">父窗口 designer</text>
    <text x="38" y="190" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">iframe.contentWindow.</text>
    <text x="38" y="208" font-size="12" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">magic.updateRootConfig(dsl)</text>
    <text x="38" y="226" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">写入 DSL</text>
    <text x="38" y="244" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">触发画布重渲染</text>
    <line x1="278" y1="195" x2="296" y2="195" stroke="#f8fafc" stroke-width="2.5"/>
    <polygon points="296,189 308,195 296,201" fill="#f8fafc"/>
    <line x1="296" y1="210" x2="278" y2="210" stroke="#f8fafc" stroke-width="2.5"/>
    <polygon points="278,204 266,210 278,216" fill="#f8fafc"/>
    <rect x="314" y="150" width="234" height="110" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.4"/>
    <rect x="314" y="150" width="234" height="22" rx="8" fill="#1e2a44"/>
    <text x="328" y="167" font-size="12.5" font-weight="bold" fill="#22d3ee">iframe runtime</text>
    <text x="328" y="190" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">const dsl = useEditorDsl()</text>
    <text x="328" y="208" font-size="12" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">watch(dsl, renderPage)</text>
    <text x="328" y="226" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">订阅变化</text>
    <text x="328" y="244" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">驱动真实 DOM</text>
    <rect x="24" y="272" width="524" height="40" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="272" width="4" height="40" rx="2" fill="#a78bfa"/>
    <text x="40" y="289" font-size="13.5" fill="#e2e8f0">双向同步：父窗口写 DSL，iframe 订阅更新；</text>
    <text x="40" y="305" font-size="13.5" fill="#94a3b8">组件事件反向调回 magic API，形成闭环。</text>
    <rect x="24" y="318" width="524" height="40" rx="8" fill="#0a0f1c" stroke="#223055"/>
    <text x="38" y="337" font-size="13.5" fill="#e2e8f0">DSL 是两个进程之间唯一共享的数据。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#34d399" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">DSL 渲染链路：ref config Page DOM</text>
    <rect x="24" y="60" width="524" height="70" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.35"/>
    <rect x="38" y="72" width="82" height="30" rx="6" fill="#1d4ed8"/>
    <text x="79" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">dsl ref</text>
    <line x1="122" y1="87" x2="146" y2="87" stroke="#34d399" stroke-width="2"/>
    <polygon points="146,81 158,87 146,93" fill="#34d399"/>
    <rect x="160" y="72" width="148" height="30" rx="6" fill="#1e40af"/>
    <text x="234" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">updateRootConfig</text>
    <line x1="310" y1="87" x2="334" y2="87" stroke="#34d399" stroke-width="2"/>
    <polygon points="334,81 346,87 334,93" fill="#34d399"/>
    <rect x="350" y="72" width="92" height="30" rx="6" fill="#1e40af"/>
    <text x="396" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">pageConfig</text>
    <line x1="444" y1="87" x2="468" y2="87" stroke="#34d399" stroke-width="2"/>
    <polygon points="468,81 480,87 468,93" fill="#34d399"/>
    <rect x="482" y="72" width="56" height="30" rx="6" fill="#34d399"/>
    <text x="510" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b1220">Page</text>
    <rect x="24" y="140" width="524" height="160" rx="8" fill="#f8fafc" stroke="#22d3ee" stroke-opacity="0.5"/>
    <rect x="24" y="140" width="524" height="22" rx="8" fill="#e2e8f0"/>
    <rect x="24" y="140" width="120" height="22" rx="8" fill="#cbd5e1"/>
    <circle cx="38" cy="151" r="3" fill="#34d399"/>
    <circle cx="50" cy="151" r="3" fill="#fbbf24"/>
    <circle cx="62" cy="151" r="3" fill="#f472b6"/>
    <text x="90" y="155" font-size="11" fill="#334155" font-family="'SF Mono',Consolas,monospace">runtime.html iframe</text>
    <rect x="40" y="170" width="250" height="110" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="50" y="190" font-size="13" font-weight="bold" fill="#0b1220">欢迎使用 tmagic-editor</text>
    <text x="50" y="208" font-size="11" fill="#64748b">DSL 驱动渲染</text>
    <rect x="50" y="220" width="90" height="28" rx="6" fill="#22d3ee"/>
    <text x="95" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">点击我</text>
    <rect x="150" y="220" width="90" height="28" rx="6" fill="#7C3AED"/>
    <text x="195" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">另一个按钮</text>
    <rect x="310" y="170" width="220" height="110" rx="4" fill="#0b1220"/>
    <text x="320" y="190" font-size="10.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">[tmagic] render start</text>
    <text x="320" y="204" font-size="10.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">[tmagic] diff 12 nodes</text>
    <text x="320" y="218" font-size="10.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">[tmagic] patch applied</text>
    <text x="320" y="232" font-size="10.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">[tmagic] render done 12ms</text>
    <text x="320" y="250" font-size="10.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">DSL 更新触发整条链路重跑</text>
    <rect x="24" y="310" width="524" height="40" rx="8" fill="#0a0f1c" stroke="#223055"/>
    <text x="38" y="329" font-size="13.5" fill="#e2e8f0">结论：DSL 是唯一事实源，链路不能有分叉。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#fbbf24" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#fbbf24"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">坑：启动顺序不对，Monaco 先炸了</text>
    <g data-role="uncle" transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="340" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">启动顺序不对，Monaco 加载失败，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">整个 designer 白屏。</text>
    <rect x="24" y="150" width="524" height="98" rx="8" fill="#0a0f1c" stroke="#fbbf24" stroke-opacity="0.4"/>
    <rect x="24" y="150" width="524" height="22" rx="8" fill="#1e2a44"/>
    <text x="38" y="167" font-size="11" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">terminal / zsh</text>
    <text x="38" y="192" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">$ cd labs/tmagic-editor</text>
    <text x="38" y="210" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">$ pnpm install</text>
    <text x="38" y="228" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">$ pnpm dev</text>
    <rect x="24" y="260" width="524" height="52" rx="8" fill="#111a30" stroke="#f97316" stroke-opacity="0.5"/>
    <rect x="24" y="260" width="4" height="52" rx="2" fill="#f97316"/>
    <text x="40" y="282" font-size="13" font-weight="bold" fill="#f97316">Monaco 坑点：顺序不能反</text>
    <text x="40" y="302" font-size="12.5" fill="#94a3b8">必须在 Designer 挂载前加载 Monaco；否则 MonacoEnvironment 找不到。</text>
    <rect x="24" y="318" width="524" height="40" rx="8" fill="#0a0f1c" stroke="#223055"/>
    <text x="38" y="337" font-size="13.5" fill="#e2e8f0">顺序：loadScript Monaco 先，new Designer 后。</text>
  </g>
</svg>
