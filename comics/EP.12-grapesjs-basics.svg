<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="ep12-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="ep12-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#ep12-bg)"/>
  <polygon points="1000,0 1080,0 780,840 700,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="140,0 210,0 1030,840 960,840" fill="#f97316" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.12</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#ep12-title)">自由画布的代价</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">低代码产品实战 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#ep12-title)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">自由画布：拖哪算哪，没有约束</text>
    <g data-role="label" transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="340" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">把 div 拖到画布任意位置，结果样式乱、</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">层级乱、导出 HTML 一塌糊涂！</text>
    <rect x="24" y="150" width="320" height="150" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <rect x="24" y="150" width="320" height="22" rx="8" fill="#1e2a44"/>
    <text x="38" y="167" font-size="12.5" font-weight="bold" fill="#f97316">自由画布 Canvas（无约束）</text>
    <rect x="40" y="180" width="110" height="44" rx="4" fill="#7C3AED" opacity="0.75"/>
    <text x="95" y="207" text-anchor="middle" font-size="11" fill="#ffffff">div z=3</text>
    <rect x="130" y="200" width="100" height="56" rx="4" fill="#22d3ee" opacity="0.6"/>
    <text x="180" y="233" text-anchor="middle" font-size="11" fill="#0b1220">div z=1</text>
    <rect x="70" y="236" width="120" height="48" rx="4" fill="#f97316" opacity="0.7"/>
    <text x="130" y="265" text-anchor="middle" font-size="11" fill="#ffffff">div z=5</text>
    <rect x="210" y="184" width="110" height="44" rx="4" fill="#34d399" opacity="0.6"/>
    <text x="265" y="211" text-anchor="middle" font-size="11" fill="#0b1220">div z=2</text>
    <rect x="354" y="150" width="194" height="150" rx="8" fill="#0a0f1c" stroke="#fbbf24" stroke-opacity="0.4"/>
    <rect x="354" y="150" width="194" height="22" rx="8" fill="#1e2a44"/>
    <text x="368" y="167" font-size="12.5" font-weight="bold" fill="#fbbf24">导出 HTML 预览</text>
    <text x="368" y="192" font-size="10.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">&lt;div style="..."&gt;</text>
    <text x="368" y="208" font-size="10.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">&lt;div style="..."&gt;</text>
    <text x="380" y="224" font-size="10.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">&lt;span&gt;...&lt;/span&gt;</text>
    <text x="380" y="240" font-size="10.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">&lt;div&gt;...&lt;/div&gt;</text>
    <text x="380" y="256" font-size="10.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">&lt;div&gt;...&lt;/div&gt;</text>
    <text x="368" y="272" font-size="10.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">&lt;/div&gt;</text>
    <text x="368" y="288" font-size="10" fill="#fbbf24">inline style 满天飞，z-index 靠猜</text>
    <rect x="24" y="310" width="524" height="40" rx="8" fill="#111a30" stroke="#f97316" stroke-opacity="0.5"/>
    <rect x="24" y="310" width="4" height="40" rx="2" fill="#f97316"/>
    <text x="40" y="329" font-size="13.5" fill="#f97316">困境：自由画布没有约束，导出产物不可控。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">GrapesJS = 五大模块拼起来</text>
    <g data-role="pixel" transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="340" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">GrapesJS 不是一块大铁板，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">是五个模块各司其职拼起来的。</text>
    <rect x="24" y="150" width="100" height="56" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.5"/>
    <rect x="24" y="150" width="100" height="18" rx="8" fill="#1e2a44"/>
    <text x="74" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#22d3ee">Blocks</text>
    <text x="74" y="190" text-anchor="middle" font-size="11" fill="#94a3b8">左侧拖拽源</text>
    <rect x="130" y="150" width="100" height="56" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.5"/>
    <rect x="130" y="150" width="100" height="18" rx="8" fill="#1e2a44"/>
    <text x="180" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#a78bfa">Components</text>
    <text x="180" y="190" text-anchor="middle" font-size="11" fill="#94a3b8">画布节点树</text>
    <rect x="236" y="150" width="100" height="56" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.5"/>
    <rect x="236" y="150" width="100" height="18" rx="8" fill="#1e2a44"/>
    <text x="286" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#f97316">Styles</text>
    <text x="286" y="190" text-anchor="middle" font-size="11" fill="#94a3b8">CSSOM 管理</text>
    <rect x="342" y="150" width="100" height="56" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.5"/>
    <rect x="342" y="150" width="100" height="18" rx="8" fill="#1e2a44"/>
    <text x="392" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#34d399">Storage</text>
    <text x="392" y="190" text-anchor="middle" font-size="11" fill="#94a3b8">自动持久化</text>
    <rect x="448" y="150" width="100" height="56" rx="8" fill="#0a0f1c" stroke="#fbbf24" stroke-opacity="0.5"/>
    <rect x="448" y="150" width="100" height="18" rx="8" fill="#1e2a44"/>
    <text x="498" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#fbbf24">Commands</text>
    <text x="498" y="190" text-anchor="middle" font-size="11" fill="#94a3b8">导出/撤销</text>
    <rect x="24" y="218" width="524" height="60" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.4"/>
    <rect x="24" y="218" width="524" height="22" rx="8" fill="#1e2a44"/>
    <text x="38" y="235" font-size="11.5" font-weight="bold" fill="#22d3ee">注册一个 Block（代码芯片）</text>
    <text x="38" y="258" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">editor.Blocks.add("my-block", {"</text>
    <text x="52" y="274" font-size="12" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">label: "My Block", content: "&lt;div/&gt;"</text>
    <rect x="24" y="288" width="524" height="62" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <rect x="24" y="288" width="4" height="62" rx="2" fill="#a78bfa"/>
    <text x="40" y="310" font-size="13" font-weight="bold" fill="#a78bfa">每个模块都是独立 API，可单独替换</text>
    <text x="40" y="330" font-size="12" fill="#94a3b8">Blocks 管拖拽源，Components 管节点，Styles 管样式，</text>
    <text x="40" y="344" font-size="12" fill="#94a3b8">Storage 管持久化，Commands 管导出/撤销。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#34d399" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：Block 拖入 → 画布渲染 → 导出</text>
    <rect x="24" y="60" width="130" height="240" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.4"/>
    <rect x="24" y="60" width="130" height="22" rx="8" fill="#1e2a44"/>
    <text x="89" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#34d399">Blocks 面板</text>
    <rect x="36" y="92" width="106" height="34" rx="6" fill="#1e2a44" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="89" y="114" text-anchor="middle" font-size="12" fill="#e2e8f0">Section</text>
    <rect x="36" y="134" width="106" height="34" rx="6" fill="#1e2a44" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="89" y="156" text-anchor="middle" font-size="12" fill="#e2e8f0">Text</text>
    <rect x="36" y="176" width="106" height="34" rx="6" fill="#1e2a44" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="89" y="198" text-anchor="middle" font-size="12" fill="#e2e8f0">Button</text>
    <rect x="36" y="218" width="106" height="34" rx="6" fill="#1e2a44" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="89" y="240" text-anchor="middle" font-size="12" fill="#e2e8f0">Image</text>
    <rect x="36" y="260" width="106" height="34" rx="6" fill="#1e2a44" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="89" y="282" text-anchor="middle" font-size="12" fill="#e2e8f0">Column</text>
    <line x1="156" y1="150" x2="178" y2="150" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4 3"/>
    <polygon points="178,144 190,150 178,156" fill="#34d399"/>
    <rect x="196" y="60" width="220" height="240" rx="8" fill="#f8fafc" stroke="#22d3ee" stroke-opacity="0.5"/>
    <rect x="196" y="60" width="220" height="22" rx="8" fill="#e2e8f0"/>
    <circle cx="210" cy="71" r="3" fill="#34d399"/>
    <circle cx="222" cy="71" r="3" fill="#fbbf24"/>
    <circle cx="234" cy="71" r="3" fill="#f472b6"/>
    <text x="244" y="75" font-size="10" fill="#334155" font-family="'SF Mono',Consolas,monospace">gjs-canvas</text>
    <rect x="210" y="92" width="192" height="60" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="218" y="112" font-size="12" font-weight="bold" fill="#0b1220">Section</text>
    <text x="218" y="130" font-size="11" fill="#64748b">这是一个 Section 容器</text>
    <rect x="210" y="160" width="192" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="218" y="180" font-size="12" fill="#0b1220">Hello GrapesJS</text>
    <rect x="210" y="198" width="80" height="30" rx="6" fill="#22d3ee"/>
    <text x="250" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">按钮</text>
    <rect x="424" y="60" width="124" height="240" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <rect x="424" y="60" width="124" height="22" rx="8" fill="#1e2a44"/>
    <text x="486" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#f97316">导出产物</text>
    <text x="436" y="100" font-size="10.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">getHtml()</text>
    <text x="436" y="116" font-size="10" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">&lt;section&gt;</text>
    <text x="446" y="130" font-size="10" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">&lt;div&gt;...&lt;/div&gt;</text>
    <text x="436" y="144" font-size="10" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">&lt;/section&gt;</text>
    <text x="436" y="166" font-size="10.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">getCss()</text>
    <text x="436" y="182" font-size="10" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">.cls-1 { ... }</text>
    <text x="436" y="196" font-size="10" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">.cls-2 { ... }</text>
    <text x="436" y="210" font-size="10" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">button { ... }</text>
    <rect x="24" y="310" width="524" height="40" rx="8" fill="#0a0f1c" stroke="#223055"/>
    <text x="38" y="329" font-size="13.5" fill="#e2e8f0">结论：Block → Component → Styles 链路完整，导出分离 HTML 与 CSS。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#fbbf24" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#fbbf24"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：自由不等于无约束</text>
    <g data-role="uncle" transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="340" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">自由不是不管，而是约束换了地方。</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">这三大约束你得提前设计好。</text>
    <rect x="24" y="150" width="524" height="60" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.4"/>
    <rect x="24" y="150" width="4" height="60" rx="2" fill="#34d399"/>
    <text x="40" y="172" font-size="13" font-weight="bold" fill="#34d399">1. Storage 自动存 localStorage</text>
    <text x="40" y="192" font-size="12" fill="#94a3b8">配置 storageManager: { type: "local" }，画布改动自动持久化，刷新不丢。</text>
    <rect x="24" y="220" width="524" height="60" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.4"/>
    <rect x="24" y="220" width="4" height="60" rx="2" fill="#22d3ee"/>
    <text x="40" y="242" font-size="13" font-weight="bold" fill="#22d3ee">2. Styles 走 CSSOM，不写 inline</text>
    <text x="40" y="262" font-size="12" fill="#94a3b8">GrapesJS 把样式编译成 class 写进 style 标签，导出的是干净 CSS。</text>
    <rect x="24" y="290" width="524" height="62" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <rect x="24" y="290" width="4" height="62" rx="2" fill="#f97316"/>
    <text x="40" y="312" font-size="13" font-weight="bold" fill="#f97316">3. 导出必须在 load 之后</text>
    <text x="40" y="332" font-size="12" fill="#94a3b8">getHtml/getCss 要等 editor 加载完组件树再调，否则拿到空串。</text>
  </g>
</svg>
