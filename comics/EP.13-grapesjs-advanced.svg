<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="ep13-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="ep13-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#ep13-bg)"/>
  <polygon points="1000,0 1080,0 780,840 700,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="140,0 210,0 1030,840 960,840" fill="#f97316" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.13</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#ep13-title)">画布自由，工程不自由</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">低代码产品实战 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#ep13-title)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">自定义组件没 trait，属性面板是空的</text>
    <g data-role="label" transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="370" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">写了个 Hero 横幅组件，每次拖入都要</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">手动改颜色标题，属性面板没定制字段。</text>
    <rect x="24" y="150" width="250" height="150" rx="8" fill="#f8fafc" stroke="#f97316" stroke-opacity="0.4"/>
    <rect x="24" y="150" width="250" height="22" rx="8" fill="#e2e8f0"/>
    <text x="38" y="166" font-size="11" fill="#334155" font-family="'SF Mono',Consolas,monospace">gjs-canvas Hero 组件</text>
    <rect x="40" y="182" width="218" height="56" rx="4" fill="#7C3AED"/>
    <text x="149" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">默认标题占位</text>
    <text x="149" y="226" text-anchor="middle" font-size="11" fill="#e2e8f0">副标题占位文字</text>
    <text x="149" y="252" text-anchor="middle" font-size="11" fill="#64748b">← 每次拖入都长这样，得手动改</text>
    <rect x="284" y="150" width="264" height="150" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <rect x="284" y="150" width="264" height="22" rx="8" fill="#1e2a44"/>
    <text x="298" y="167" font-size="12.5" font-weight="bold" fill="#f97316">右侧属性面板（空）</text>
    <text x="298" y="194" font-size="12" fill="#64748b">没有 title 字段</text>
    <text x="298" y="212" font-size="12" fill="#64748b">没有 subtitle 字段</text>
    <text x="298" y="230" font-size="12" fill="#64748b">没有 bgColor 字段</text>
    <text x="298" y="248" font-size="12" fill="#64748b">只能在画布上直接改 DOM</text>
    <text x="298" y="282" font-size="11" fill="#fbbf24">改完还不持久化</text>
    <rect x="24" y="310" width="524" height="40" rx="8" fill="#111a30" stroke="#f97316" stroke-opacity="0.5"/>
    <rect x="24" y="310" width="4" height="40" rx="2" fill="#f97316"/>
    <text x="40" y="329" font-size="13.5" fill="#f97316">困境：自定义组件没有 trait，属性面板无法编辑。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">addType + traits + Plugins 三件套</text>
    <g data-role="pixel" transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="370" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">DomComponents.addType 注册类型，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">traits 定义面板字段，Plugins 打包。</text>
    <rect x="24" y="150" width="524" height="126" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.4"/>
    <rect x="24" y="150" width="524" height="22" rx="8" fill="#1e2a44"/>
    <text x="38" y="167" font-size="11.5" font-weight="bold" fill="#22d3ee">注册 Hero 组件类型（代码芯片）</text>
    <text x="38" y="190" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">editor.DomComponents.addType("hero", {"</text>
    <text x="52" y="206" font-size="11.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">model: {"</text>
    <text x="66" y="222" font-size="11.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">defaults: {"</text>
    <text x="80" y="238" font-size="11.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">traits: ["title", "subtitle", "bgColor"]</text>
    <text x="66" y="254" font-size="11.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">}</text>
    <text x="52" y="270" font-size="11.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">}</text>
    <rect x="24" y="286" width="252" height="66" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.4"/>
    <rect x="24" y="286" width="4" height="66" rx="2" fill="#a78bfa"/>
    <text x="40" y="306" font-size="12.5" font-weight="bold" fill="#a78bfa">traits 数组</text>
    <text x="40" y="324" font-size="11.5" fill="#94a3b8">每个元素自动生成一个属性面板字段，</text>
    <text x="40" y="340" font-size="11.5" fill="#94a3b8">支持 text / number / select / color。</text>
    <rect x="284" y="286" width="264" height="66" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.4"/>
    <rect x="284" y="286" width="4" height="66" rx="2" fill="#34d399"/>
    <text x="300" y="306" font-size="12.5" font-weight="bold" fill="#34d399">editor.Plugins.add</text>
    <text x="300" y="324" font-size="11.5" fill="#94a3b8">把 addType + Block 注册打包成插件，</text>
    <text x="300" y="340" font-size="11.5" fill="#94a3b8">初始化时 plugins: ["my-hero-plugin"]。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#34d399" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：trait 实时生效 + 响应式断点</text>
    <rect x="24" y="60" width="130" height="100" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.4"/>
    <rect x="24" y="60" width="130" height="22" rx="8" fill="#1e2a44"/>
    <text x="89" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#34d399">Blocks</text>
    <rect x="36" y="92" width="106" height="30" rx="6" fill="#1e2a44" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="89" y="112" text-anchor="middle" font-size="12" fill="#e2e8f0">Hero 横幅</text>
    <rect x="36" y="130" width="106" height="22" rx="4" fill="#1e2a44" stroke="#223055"/>
    <line x1="156" y1="108" x2="178" y2="108" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4 3"/>
    <polygon points="178,102 190,108 178,114" fill="#34d399"/>
    <rect x="196" y="60" width="220" height="180" rx="8" fill="#f8fafc" stroke="#22d3ee" stroke-opacity="0.5"/>
    <rect x="196" y="60" width="220" height="22" rx="8" fill="#e2e8f0"/>
    <circle cx="210" cy="71" r="3" fill="#34d399"/>
    <circle cx="222" cy="71" r="3" fill="#fbbf24"/>
    <circle cx="234" cy="71" r="3" fill="#f472b6"/>
    <text x="244" y="75" font-size="10" fill="#334155" font-family="'SF Mono',Consolas,monospace">gjs-canvas</text>
    <rect x="210" y="92" width="192" height="64" rx="4" fill="#22d3ee"/>
    <text x="306" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">实时更新的标题</text>
    <text x="306" y="140" text-anchor="middle" font-size="11" fill="#0b1220">副标题也跟着变</text>
    <text x="306" y="166" text-anchor="middle" font-size="11" fill="#34d399">bgColor 实时生效</text>
    <rect x="424" y="60" width="124" height="180" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.4"/>
    <rect x="424" y="60" width="124" height="22" rx="8" fill="#1e2a44"/>
    <text x="486" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a78bfa">Traits 面板</text>
    <text x="436" y="100" font-size="11" fill="#94a3b8">title</text>
    <rect x="436" y="104" width="100" height="18" rx="3" fill="#1e2a44" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="442" y="117" font-size="10.5" fill="#e2e8f0">实时更新的标题</text>
    <text x="436" y="136" font-size="11" fill="#94a3b8">subtitle</text>
    <rect x="436" y="140" width="100" height="18" rx="3" fill="#1e2a44" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="442" y="153" font-size="10.5" fill="#e2e8f0">副标题也跟着变</text>
    <text x="436" y="172" font-size="11" fill="#94a3b8">bgColor</text>
    <rect x="436" y="176" width="100" height="18" rx="3" fill="#1e2a44" stroke="#a78bfa" stroke-opacity="0.4"/>
    <rect x="440" y="179" width="14" height="12" rx="2" fill="#22d3ee"/>
    <text x="460" y="189" font-size="10.5" fill="#e2e8f0">#22d3ee</text>
    <rect x="24" y="252" width="524" height="48" rx="8" fill="#0a0f1c" stroke="#fbbf24" stroke-opacity="0.4"/>
    <rect x="24" y="252" width="4" height="48" rx="2" fill="#fbbf24"/>
    <text x="40" y="272" font-size="12.5" font-weight="bold" fill="#fbbf24">响应式断点：桌面 / 平板 / 手机</text>
    <rect x="40" y="280" width="60" height="14" rx="4" fill="#1e2a44" stroke="#fbbf24" stroke-opacity="0.4"/>
    <text x="70" y="291" text-anchor="middle" font-size="10" fill="#fbbf24">桌面</text>
    <rect x="106" y="280" width="60" height="14" rx="4" fill="#1e2a44" stroke="#223055"/>
    <text x="136" y="291" text-anchor="middle" font-size="10" fill="#94a3b8">平板</text>
    <rect x="172" y="280" width="60" height="14" rx="4" fill="#1e2a44" stroke="#223055"/>
    <text x="202" y="291" text-anchor="middle" font-size="10" fill="#94a3b8">手机</text>
    <text x="244" y="291" font-size="11" fill="#94a3b8">setDevice 切换画布宽度，媒体查询同步</text>
    <rect x="24" y="310" width="524" height="40" rx="8" fill="#0a0f1c" stroke="#223055"/>
    <text x="38" y="329" font-size="13.5" fill="#e2e8f0">结论：trait 改值 → 画布实时重渲染，断点切换走 CSS 媒体查询。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#fbbf24" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#fbbf24"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：画布自由，工程约束留给开发者</text>
    <g data-role="uncle" transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="370" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">画布自由度交给用户，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">工程约束要靠开发者提前设计。</text>
    <rect x="24" y="150" width="252" height="58" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.4"/>
    <rect x="24" y="150" width="4" height="58" rx="2" fill="#22d3ee"/>
    <text x="40" y="170" font-size="12.5" font-weight="bold" fill="#22d3ee">组件类型 addType</text>
    <text x="40" y="188" font-size="11.5" fill="#94a3b8">定义节点结构与默认属性，</text>
    <text x="40" y="202" font-size="11.5" fill="#94a3b8">是画布渲染的最小单元。</text>
    <rect x="284" y="150" width="264" height="58" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.4"/>
    <rect x="284" y="150" width="4" height="58" rx="2" fill="#a78bfa"/>
    <text x="300" y="170" font-size="12.5" font-weight="bold" fill="#a78bfa">trait 字段</text>
    <text x="300" y="188" font-size="11.5" fill="#94a3b8">决定属性面板能编辑什么，</text>
    <text x="300" y="202" font-size="11.5" fill="#94a3b8">不写 trait 面板就是空的。</text>
    <rect x="24" y="218" width="252" height="58" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.4"/>
    <rect x="24" y="218" width="4" height="58" rx="2" fill="#34d399"/>
    <text x="40" y="238" font-size="12.5" font-weight="bold" fill="#34d399">插件 Plugins.add</text>
    <text x="40" y="256" font-size="11.5" fill="#94a3b8">把类型 + Block + trait 打包，</text>
    <text x="40" y="270" font-size="11.5" fill="#94a3b8">复用和分发的基本单位。</text>
    <rect x="284" y="218" width="264" height="58" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <rect x="284" y="218" width="4" height="58" rx="2" fill="#f97316"/>
    <text x="300" y="238" font-size="12.5" font-weight="bold" fill="#f97316">样式作用域</text>
    <text x="300" y="256" font-size="11.5" fill="#94a3b8">导出 CSS 要加作用域前缀，</text>
    <text x="300" y="270" font-size="11.5" fill="#94a3b8">避免污染宿主页面样式。</text>
    <rect x="24" y="286" width="524" height="64" rx="8" fill="#111a30" stroke="#fbbf24" stroke-opacity="0.5"/>
    <rect x="24" y="286" width="4" height="64" rx="2" fill="#fbbf24"/>
    <text x="40" y="308" font-size="13" font-weight="bold" fill="#fbbf24">一句话：画布越自由，工程约束越要前置设计</text>
    <text x="40" y="328" font-size="12" fill="#94a3b8">addType 定结构，trait 定面板，plugins 定分发，样式作用域定隔离。</text>
    <text x="40" y="344" font-size="12" fill="#94a3b8">四件事想清楚，自由画布才不会变成脱缰野马。</text>
  </g>
</svg>
