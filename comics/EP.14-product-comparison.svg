      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="240" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">别比功能清单，先问自己</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">三个问题，范围立刻缩小。</text>
    <rect x="24" y="150" width="524" height="56" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.4"/>
    <rect x="24" y="150" width="4" height="56" rx="2" fill="#22d3ee"/>
    <text x="40" y="170" font-size="12.5" font-weight="bold" fill="#22d3ee">Q1 · 表单为主 还是 页面为主？</text>
    <text x="40" y="192" font-size="11.5" fill="#94a3b8">表单 → Formily / amis ；页面 → 进入 Q2</text>
    <rect x="24" y="214" width="524" height="56" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.4"/>
    <rect x="24" y="214" width="4" height="56" rx="2" fill="#a78bfa"/>
    <text x="40" y="234" font-size="12.5" font-weight="bold" fill="#a78bfa">Q2 · 要自由画布 还是 约束 Schema？</text>
    <text x="40" y="256" font-size="11.5" fill="#94a3b8">自由 → GrapesJS ；约束 → 进入 Q3</text>
    <rect x="24" y="278" width="524" height="56" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <rect x="24" y="278" width="4" height="56" rx="2" fill="#f97316"/>
    <text x="40" y="298" font-size="12.5" font-weight="bold" fill="#f97316">Q3 · 是否需要跨端（PC / H5 / 小程序）？</text>
    <text x="40" y="320" font-size="11.5" fill="#94a3b8">跨端 → tmagic-editor ；单端 → amis / lowcode-engine</text>
    <rect x="24" y="344" width="524" height="10" rx="8" fill="#111a30" stroke="#223055"/>
    <text x="24" y="334" font-size="11" fill="#34d399">三问答完，选型范围从 5 个缩小到 1-2 个。</text>
  </g>

  <g transform="translate(20,462)">
