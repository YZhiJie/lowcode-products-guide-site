    <text x="36" y="118" font-size="11.5" fill="#e2e8f0">上线速度最快。</text>
    <rect x="36" y="130" width="60" height="20" rx="10" fill="#22d3ee" opacity="0.2"/>
    <text x="66" y="144" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#22d3ee">最快</text>
    <rect x="202" y="60" width="168" height="110" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.4"/>
    <rect x="202" y="60" width="168" height="22" rx="8" fill="#1e2a44"/>
    <text x="286" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#f472b6">Formily</text>
    <text x="214" y="100" font-size="11.5" fill="#e2e8f0">复杂表单联动，</text>
    <text x="214" y="118" font-size="11.5" fill="#e2e8f0">校验能力最强。</text>
    <rect x="214" y="130" width="60" height="20" rx="10" fill="#f472b6" opacity="0.2"/>
    <text x="244" y="144" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#f472b6">表单最强</text>
    <rect x="380" y="60" width="168" height="110" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.4"/>
    <rect x="380" y="60" width="168" height="22" rx="8" fill="#1e2a44"/>
    <text x="464" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#a78bfa">lowcode-engine</text>
    <text x="392" y="100" font-size="11.5" fill="#e2e8f0">物料插件可定制，</text>
    <text x="392" y="118" font-size="11.5" fill="#e2e8f0">扩展空间最大。</text>
    <rect x="392" y="130" width="60" height="20" rx="10" fill="#a78bfa" opacity="0.2"/>
    <text x="422" y="144" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a78bfa">最灵活</text>
    <rect x="24" y="180" width="250" height="110" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <rect x="24" y="180" width="250" height="22" rx="8" fill="#1e2a44"/>
    <text x="149" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#f97316">tmagic-editor</text>
    <text x="36" y="220" font-size="11.5" fill="#e2e8f0">同一套 DSL 出 PC + H5 + 小程序，</text>
    <text x="36" y="238" font-size="11.5" fill="#e2e8f0">跨端能力最完整。</text>
    <rect x="36" y="250" width="60" height="20" rx="10" fill="#f97316" opacity="0.2"/>
    <text x="66" y="264" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#f97316">跨端好</text>
    <rect x="284" y="180" width="264" height="110" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.4"/>
    <rect x="284" y="180" width="264" height="22" rx="8" fill="#1e2a44"/>
    <text x="416" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#34d399">GrapesJS</text>
    <text x="296" y="220" font-size="11.5" fill="#e2e8f0">自由画布拖哪算哪，</text>
    <text x="296" y="238" font-size="11.5" fill="#e2e8f0">落地页搭建最自由。</text>
    <rect x="296" y="250" width="60" height="20" rx="10" fill="#34d399" opacity="0.2"/>
    <text x="326" y="264" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#34d399">最自由</text>
    <rect x="24" y="302" width="524" height="48" rx="8" fill="#111a30" stroke="#223055"/>
    <text x="38" y="322" font-size="12.5" fill="#e2e8f0">结论：同一个需求五个产品都能做，但开发效率、扩展空间、</text>
    <text x="38" y="340" font-size="12.5" fill="#e2e8f0">跨端能力天差地别——选型就是选取舍。</text>
  </g>

