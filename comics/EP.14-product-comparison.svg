    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="300" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">没有最好的低代码，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">只有最适合当前场景的。</text>
    <rect x="24" y="150" width="524" height="38" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.4"/>
    <rect x="24" y="150" width="4" height="38" rx="2" fill="#22d3ee"/>
    <text x="40" y="174" font-size="13" font-weight="bold" fill="#22d3ee">amis → 中后台系统</text>
    <text x="200" y="174" font-size="12" fill="#94a3b8">CRUD 密集、追求上线速度</text>
    <rect x="24" y="196" width="524" height="38" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.4"/>
    <rect x="24" y="196" width="4" height="38" rx="2" fill="#f472b6"/>
    <text x="40" y="220" font-size="13" font-weight="bold" fill="#f472b6">Formily → 复杂表单场景</text>
    <text x="222" y="220" font-size="12" fill="#94a3b8">联动多、校验重、字段多</text>
    <rect x="24" y="242" width="524" height="38" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.4"/>
    <rect x="24" y="242" width="4" height="38" rx="2" fill="#a78bfa"/>
    <text x="40" y="266" font-size="13" font-weight="bold" fill="#a78bfa">lowcode-engine → 深度定制化</text>
    <text x="258" y="266" font-size="12" fill="#94a3b8">自研物料、插件体系</text>
    <rect x="24" y="288" width="524" height="38" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <rect x="24" y="288" width="4" height="38" rx="2" fill="#f97316"/>
    <text x="40" y="312" font-size="13" font-weight="bold" fill="#f97316">tmagic-editor → H5 活动页</text>
    <text x="236" y="312" font-size="12" fill="#94a3b8">多端投放、一套 DSL</text>
    <rect x="24" y="334" width="524" height="20" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.4"/>
