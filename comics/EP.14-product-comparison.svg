    <text x="340" y="106" font-size="11.5" fill="#e2e8f0">客户运营后台（表单+列表）</text>
    <rect x="332" y="118" width="204" height="22" rx="4" fill="#1e2a44"/>
    <text x="340" y="134" font-size="11.5" fill="#e2e8f0">运营可配 · 上线快</text>
    <rect x="332" y="146" width="204" height="22" rx="4" fill="#1e2a44"/>
    <text x="340" y="162" font-size="11.5" fill="#94a3b8">要支持 PC + 移动端 H5</text>
    <rect x="24" y="200" width="100" height="100" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.5"/>
