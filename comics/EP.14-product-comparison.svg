    <text x="102" y="126" font-size="15" fill="#0b1220">五个产品到底选哪个？</text>
    <rect x="320" y="60" width="228" height="120" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
