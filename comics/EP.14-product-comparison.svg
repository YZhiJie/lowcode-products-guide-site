    <rect x="130" y="200" width="100" height="100" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.5"/>
    <rect x="130" y="200" width="100" height="20" rx="8" fill="#1e2a44"/>
    <text x="180" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#f472b6">Formily</text>
    <text x="180" y="252" text-anchor="middle" font-size="22" font-weight="bold" fill="#94a3b8">?</text>
    <text x="180" y="282" text-anchor="middle" font-size="10.5" fill="#94a3b8">阿里</text>
    <rect x="236" y="200" width="100" height="100" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.5"/>
