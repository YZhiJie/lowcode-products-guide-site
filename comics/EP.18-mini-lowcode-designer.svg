<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="ep18-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="ep18-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#ep18-bg)"/>
  <polygon points="1000,0 1080,0 780,840 700,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="140,0 210,0 1030,840 960,840" fill="#f97316" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.18</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#ep18-title)">拖拽落点之谜</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">低代码产品实战 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#ep18-title)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">拖一个组件，该放哪？</text>
    <g data-role="label" transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="240" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">我拖了个按钮，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">到底该放哪啊？</text>
    <rect x="24" y="150" width="524" height="198" rx="10" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <rect x="24" y="150" width="524" height="24" rx="10" fill="#1e2a44"/>
    <text x="286" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#f97316">画布 · 拖拽中</text>
    <rect x="44" y="190" width="120" height="36" rx="6" fill="#223055" stroke="#94a3b8" stroke-opacity="0.5"/>
    <text x="104" y="213" text-anchor="middle" font-size="12" fill="#e2e8f0">标题文本</text>
    <rect x="44" y="236" width="120" height="36" rx="6" fill="#223055" stroke="#94a3b8" stroke-opacity="0.5"/>
    <text x="104" y="259" text-anchor="middle" font-size="12" fill="#e2e8f0">输入框</text>
    <rect x="44" y="282" width="120" height="36" rx="6" fill="#223055" stroke="#94a3b8" stroke-opacity="0.5"/>
    <text x="104" y="305" text-anchor="middle" font-size="12" fill="#e2e8f0">提交按钮</text>
    <rect x="340" y="190" width="120" height="36" rx="6" fill="#7C3AED" opacity="0.6" stroke="#a78bfa" stroke-dasharray="4 3"/>
    <text x="400" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">新按钮</text>
    <path d="M 400 226 L 200 250" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
    <polygon points="196,246 206,250 196,254" fill="#f97316"/>
    <text x="400" y="178" text-anchor="middle" font-size="11" fill="#f97316">拖动中</text>
    <text x="104" y="340" text-anchor="middle" font-size="11" fill="#94a3b8">三个已有组件，新按钮放哪？</text>
    <text x="400" y="340" text-anchor="middle" font-size="11" fill="#94a3b8">before / after / inside？</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">三种落点：before / after / inside</text>
    <g data-role="pixel" transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="200" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="14" fill="#0b1220">落点只有三种，</text>
    <text x="102" y="124" font-size="14" fill="#0b1220">别想复杂了。</text>
    <rect x="24" y="150" width="168" height="198" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.4"/>
    <rect x="24" y="150" width="168" height="22" rx="8" fill="#1e2a44"/>
    <text x="108" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#22d3ee">before</text>
    <rect x="44" y="186" width="128" height="28" rx="4" fill="#7C3AED" opacity="0.5"/>
    <text x="108" y="205" text-anchor="middle" font-size="11" fill="#f8fafc">新组件</text>
    <line x1="44" y1="222" x2="172" y2="222" stroke="#22d3ee" stroke-width="2"/>
    <rect x="44" y="228" width="128" height="28" rx="4" fill="#223055"/>
    <text x="108" y="247" text-anchor="middle" font-size="11" fill="#94a3b8">目标节点</text>
    <text x="108" y="290" text-anchor="middle" font-size="11" fill="#94a3b8">插到目标前面</text>
    <rect x="204" y="150" width="168" height="198" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.4"/>
    <rect x="204" y="150" width="168" height="22" rx="8" fill="#1e2a44"/>
    <text x="288" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#a78bfa">after</text>
    <rect x="224" y="186" width="128" height="28" rx="4" fill="#223055"/>
    <text x="288" y="205" text-anchor="middle" font-size="11" fill="#94a3b8">目标节点</text>
    <line x1="224" y1="222" x2="352" y2="222" stroke="#a78bfa" stroke-width="2"/>
    <rect x="224" y="228" width="128" height="28" rx="4" fill="#7C3AED" opacity="0.5"/>
    <text x="288" y="247" text-anchor="middle" font-size="11" fill="#f8fafc">新组件</text>
    <text x="288" y="290" text-anchor="middle" font-size="11" fill="#94a3b8">插到目标后面</text>
    <rect x="384" y="150" width="164" height="198" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.4"/>
    <rect x="384" y="150" width="164" height="22" rx="8" fill="#1e2a44"/>
    <text x="466" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#f472b6">inside</text>
    <rect x="404" y="186" width="124" height="96" rx="4" fill="#223055" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="466" y="205" text-anchor="middle" font-size="11" fill="#94a3b8">目标容器</text>
    <rect x="416" y="218" width="100" height="28" rx="4" fill="#7C3AED" opacity="0.5"/>
    <text x="466" y="237" text-anchor="middle" font-size="11" fill="#f8fafc">新组件</text>
    <rect x="416" y="252" width="100" height="22" rx="4" fill="#1e2a44"/>
    <text x="466" y="268" text-anchor="middle" font-size="10" fill="#64748b">已有子节点</text>
    <text x="466" y="304" text-anchor="middle" font-size="11" fill="#94a3b8">作为子节点插入</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#fbbf24" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#fbbf24"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">禁止操作：不能乱拖</text>
    <g data-role="pixel" transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="200" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="14" fill="#0b1220">有些拖法是</text>
    <text x="102" y="124" font-size="14" fill="#0b1220">不允许的！</text>
    <rect x="24" y="150" width="248" height="198" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.5"/>
    <rect x="24" y="150" width="248" height="22" rx="8" fill="#1e2a44"/>
    <text x="148" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#f97316">禁止 1：拖进自己子孙</text>
    <rect x="44" y="184" width="208" height="32" rx="6" fill="#223055" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="148" y="205" text-anchor="middle" font-size="12" fill="#22d3ee">容器 A（拖动的节点）</text>
    <rect x="70" y="224" width="156" height="30" rx="5" fill="#1e2a44"/>
    <text x="148" y="244" text-anchor="middle" font-size="11" fill="#94a3b8">子孙 B</text>
    <path d="M 148 216 L 148 224" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 200 200 L 250 240" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="244" y1="232" x2="256" y2="244" stroke="#f97316" stroke-width="2.5"/>
    <line x1="256" y1="232" x2="244" y2="244" stroke="#f97316" stroke-width="2.5"/>
    <text x="148" y="284" text-anchor="middle" font-size="11.5" fill="#f97316">A 不能拖进自己的子孙 B</text>
    <text x="148" y="306" text-anchor="middle" font-size="11" fill="#94a3b8">否则会形成循环引用</text>
    <rect x="288" y="150" width="260" height="198" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.5"/>
    <rect x="288" y="150" width="260" height="22" rx="8" fill="#1e2a44"/>
    <text x="418" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#f97316">禁止 2：非容器 inside</text>
    <rect x="308" y="186" width="220" height="32" rx="6" fill="#223055" stroke="#f472b6" stroke-opacity="0.4"/>
    <text x="418" y="207" text-anchor="middle" font-size="12" fill="#f472b6">按钮（非容器，无 children）</text>
    <path d="M 418 218 L 418 236" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="412,234 418,242 424,234" fill="#f97316"/>
    <rect x="348" y="244" width="140" height="28" rx="5" fill="#7C3AED" opacity="0.5"/>
    <text x="418" y="263" text-anchor="middle" font-size="11" fill="#f8fafc">新组件</text>
    <line x1="360" y1="250" x2="476" y2="250" stroke="#f97316" stroke-width="2.5"/>
    <line x1="360" y1="266" x2="476" y2="266" stroke="#f97316" stroke-width="2.5"/>
    <text x="418" y="300" text-anchor="middle" font-size="11.5" fill="#f97316">按钮没有 children 字段</text>
    <text x="418" y="322" text-anchor="middle" font-size="11" fill="#94a3b8">不能往它里面塞东西</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#34d399" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">落点判断做成纯函数</text>
    <g data-role="uncle" transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="460" height="76" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">落点判断要做成纯函数，</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">输入 Schema + 位置，输出落点，</text>
    <text x="102" y="144" font-size="15" fill="#34d399">才好写单测、好调试。</text>
    <rect x="24" y="166" width="524" height="170" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.4"/>
    <rect x="24" y="166" width="524" height="22" rx="8" fill="#1e2a44"/>
    <text x="286" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#34d399">getDropPosition(schema, dragged, target, pos)</text>
    <text x="40" y="210" font-size="12" fill="#e2e8f0">function getDropPosition(schema, draggedId, targetId, pos) {</text>
    <text x="56" y="232" font-size="12" fill="#94a3b8">// 1. 不能拖进自己的子孙</text>
    <text x="56" y="252" font-size="12" fill="#f97316">if (isDescendant(draggedId, targetId)) return null;</text>
    <text x="56" y="274" font-size="12" fill="#94a3b8">// 2. 非容器不允许 inside</text>
    <text x="56" y="294" font-size="12" fill="#f97316">if (pos === 'inside' &amp;&amp; !isContainer(targetId)) return null;</text>
    <text x="56" y="316" font-size="12" fill="#34d399">return { position: pos, parentId, index };</text>
    <text x="40" y="332" font-size="12" fill="#e2e8f0">}</text>
  </g>
</svg>
