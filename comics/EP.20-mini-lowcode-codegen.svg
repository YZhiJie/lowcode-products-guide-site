    <rect x="44" y="304" width="208" height="24" rx="4" fill="#1e2a44"/>
    <text x="148" y="321" text-anchor="middle" font-size="11" fill="#94a3b8">vite.config.ts</text>
    <polygon points="288,246 298,240 298,252" fill="#f97316"/>
    <rect x="302" y="150" width="246" height="198" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.4"/>
    <rect x="302" y="150" width="246" height="22" rx="8" fill="#1e2a44"/>
    <text x="425" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#34d399">丢入产物</text>
    <rect x="322" y="188" width="206" height="36" rx="6" fill="#0e1730" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="425" y="211" text-anchor="middle" font-size="12" fill="#e2e8f0">page.vue</text>
    <rect x="322" y="232" width="206" height="36" rx="6" fill="#0e1730" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="425" y="255" text-anchor="middle" font-size="12" fill="#e2e8f0">page.schema.json</text>
    <text x="425" y="290" text-anchor="middle" font-size="12" fill="#34d399">pnpm dev</text>
    <text x="425" y="314" text-anchor="middle" font-size="12" fill="#f8fafc">✓ 直接跑起来了</text>
    <text x="425" y="336" text-anchor="middle" font-size="11" fill="#94a3b8">无需修改业务代码</text>
  </g>

  <g transform="translate(608,462)">
