    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="230" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">Codegen 把 Schema</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">转成两个产物。</text>
    <rect x="24" y="150" width="248" height="198" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.4"/>
    <rect x="24" y="150" width="248" height="22" rx="8" fill="#1e2a44"/>
    <text x="148" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#34d399">page.vue</text>
    <text x="40" y="194" font-size="11" fill="#f472b6">&lt;template&gt;</text>
    <text x="56" y="212" font-size="11" fill="#e2e8f0">&lt;div class="page"&gt;</text>
    <text x="72" y="230" font-size="11" fill="#e2e8f0">&lt;text-comp</text>
    <text x="92" y="248" font-size="11" fill="#a78bfa">text="你好" /&gt;</text>
    <text x="56" y="266" font-size="11" fill="#e2e8f0">&lt;/div&gt;</text>
    <text x="40" y="284" font-size="11" fill="#f472b6">&lt;/template&gt;</text>
    <text x="40" y="308" font-size="11" fill="#94a3b8">可运行的 Vue 组件</text>
    <text x="40" y="328" font-size="11" fill="#94a3b8">丢到任意 Vue 项目</text>
    <rect x="288" y="150" width="260" height="198" rx="8" fill="#0a0f1c" stroke="#fbbf24" stroke-opacity="0.4"/>
    <rect x="288" y="150" width="260" height="22" rx="8" fill="#1e2a44"/>
    <text x="418" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#fbbf24">page.schema.json</text>
    <text x="304" y="194" font-size="11" fill="#e2e8f0">{</text>
    <text x="320" y="212" font-size="11" fill="#a78bfa">"type"</text>
    <text x="370" y="212" font-size="11" fill="#f97316">: "page",</text>
    <text x="320" y="230" font-size="11" fill="#a78bfa">"children"</text>
    <text x="410" y="230" font-size="11" fill="#f97316">: [ ... ]</text>
    <text x="304" y="248" font-size="11" fill="#e2e8f0">}</text>
    <text x="418" y="290" text-anchor="middle" font-size="11" fill="#94a3b8">Schema 原文</text>
    <text x="418" y="310" text-anchor="middle" font-size="11" fill="#94a3b8">供其他工具消费</text>
    <text x="418" y="330" text-anchor="middle" font-size="11" fill="#94a3b8">（如服务端渲染）</text>
  </g>

  <g transform="translate(20,462)">
